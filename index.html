<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slides-Guia · Painel Verde Garopaba · SNCT 2026</title>
<meta name="description" content="Slides-Guia de 8 telas da oficina Painel Verde Garopaba (Curso 2) · SNCT 2026 · IFSC Câmpus Garopaba" />
<link rel="icon" type="image/svg+xml" href="img/logo-painel-verde.svg" />
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<!-- Estilos personalizados -->
<link rel="stylesheet" href="css/estilo.css" />
<meta name="theme-color" content="#0b7a42" />
</head>
<body>
<a class="pular" href="#palco">Ir para o conteúdo</a>
<div id="progresso" role="presentation"></div>

<!-- As 8 telas são montadas pelo DOM em js/navegacao.js, com o conteúdo de js/telas.js -->
<main id="palco"></main>

<!-- Visão geral (tecla G) -->
<div id="visao-geral" role="dialog" aria-modal="true" aria-label="Visão geral das 8 telas" hidden>
  <div class="vg-cabecalho"><strong>Visão geral · 8 telas · 120 min</strong><button type="button" id="fechar-vg" class="btn btn-outline-light">Fechar (Esc)</button></div>
  <div class="vg-grade" id="vg-grade"></div>
</div>

<!-- Notas do instrutor (tecla N) -->
<aside id="notas" hidden aria-label="Notas do instrutor"></aside>

<!-- Atalhos (tecla ?) -->
<aside id="ajuda" hidden aria-label="Atalhos do teclado">
  <strong>⌨️ Atalhos</strong>
  <ul>
    <li><kbd>←</kbd> <kbd>→</kbd> ou <kbd>Espaço</kbd> navegar</li>
    <li><kbd>1</kbd>–<kbd>8</kbd> ir direto à tela · <kbd>G</kbd> visão geral</li>
    <li><kbd>N</kbd> notas do instrutor</li>
    <li><kbd>P</kbd> cronômetro · <kbd>R</kbd> zera a tela · <kbd>Shift</kbd>+<kbd>R</kbd> zera tudo · <kbd>F</kbd> tela cheia</li>
  </ul>
</aside>

<canvas id="confete" aria-hidden="true"></canvas>

<footer class="barra-rodape">
  <span id="indicadorTela" class="fw-bold" aria-live="polite">Tela 1 / 8</span>
  <div class="linha-tempo" id="linha-tempo" role="group" aria-label="Linha do tempo da oficina (120 min)"></div>
  <button type="button" id="cronometro" title="Clique para iniciar ou pausar (tecla P)"><span class="c-tela">▶ 10:00</span><span class="c-bloco">Acolhida · 15:00</span></button>
  <div class="nav-btns">
    <button type="button" class="btn-ajuda" id="btnAjuda" aria-label="Ver atalhos do teclado" title="Atalhos (?)">?</button>
    <button type="button" class="btn btn-outline-success" id="btnAnterior" aria-label="Tela anterior">← Anterior</button>
    <button type="button" class="btn btn-success" id="btnProximo">Próxima tela →</button>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/dom.js"></script>
<script src="js/config.js"></script>
<script src="js/componentes.js"></script>
<script src="js/telas.js"></script>
<script src="js/navegacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
